name: DICOM Integration

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "pyproject.toml"
      - "src/sns_patient_360/imaging/**"
      - "tests/test_dicomweb_integration.py"
      - ".github/workflows/dicom-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dicomweb-round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start imaging stack
        run: docker compose up -d minio minio-init orthanc
      - name: Wait for Orthanc
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --user sns360:sns360-orthanc-dev-only http://127.0.0.1:8042/system >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs orthanc minio minio-init
          exit 1
      - name: STOW QIDO WADO round trip
        env:
          SNS360_DICOMWEB_INTEGRATION: "1"
        run: pytest -q tests/test_dicomweb_integration.py
      - name: Imaging service logs
        if: failure()
        run: docker compose logs orthanc minio minio-init
      - name: Stop imaging stack
        if: always()
        run: docker compose down -v
